services:
  # Web Application
  - type: web
    name: proofloop-web
    env: node
    plan: starter
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_BASE_URL
        fromService:
          type: web
          name: proofloop-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: proofloop-db
          property: connectionString
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CHANNEL3_API_KEY
        sync: false
      - key: ELASTICSEARCH_URL
        sync: false
      - key: ELASTICSEARCH_API_KEY
        sync: false
      - key: ZAPIER_WEBHOOK_URL
        sync: false
      - key: ASTROPODS_API_KEY
        sync: false

# Managed PostgreSQL Database
databases:
  - name: proofloop-db
    databaseName: proofloop
    user: proofloop_user
    plan: starter
